<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Dr. Shabeel Sulaiman's Logbook</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            margin: 0;
        }
        
        .login-card {
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            overflow: hidden;
            background: #ffffff;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(30px) scale(0.96); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            text-align: center;
            padding: 2.25rem 1.5rem 1.75rem;
            position: relative;
        }
        
        .login-body {
            padding: 2rem 1.75rem;
            background: white;
        }
        
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: #94a3b8;
            font-size: 1.2rem;
            transition: color 0.2s ease;
        }
        
        .password-toggle:hover {
            color: #2563eb;
        }
        
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            padding: 12px 45px 12px 15px;
            font-size: 16px; /* Prevents zoom on iOS */
            transition: all 0.2s ease;
        }
        
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        
        .ecg-container {
            width: 140px;
            height: 45px;
            margin: 0 auto 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .ecg-line {
            width: 100%;
            height: 100%;
            stroke: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="ecg-container">
                <svg class="ecg-line" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0,30 L30,30 L40,30 L50,10 L60,50 L70,30 L80,30 L90,30 L100,5 L110,55 L120,30 L130,30 L140,30 L150,15 L160,45 L170,30 L200,30" 
                          fill="none" 
                          stroke="#93c5fd" 
                          stroke-width="3.5" 
                          stroke-linecap="round" 
                          stroke-linejoin="round"/>
                </svg>
            </div>
            <h4 class="fw-bold mb-1">Dr. Shabeel Sulaiman</h4>
            <div class="text-light opacity-75 small">Surgical Procedure Logbook</div>
        </div>
        
        <div class="login-body">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold text-dark mb-2">
                        <i class="bi bi-shield-lock-fill text-primary me-1"></i>Security Password
                    </label>
                    <div class="position-relative">
                        <input type="password" class="form-control" id="password" required 
                               placeholder="Enter logbook password" autocomplete="current-password">
                        <span class="password-toggle" onclick="togglePassword()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>
                
                <div id="errorAlert" class="alert alert-danger d-none py-2 px-3 small border-0 d-flex align-items-center mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div>Incorrect password. Please try again.</div>
                </div>
                
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold py-2 fs-6">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Access Logbook
                    </button>
                </div>
                
                <div class="text-center">
                    <small class="text-muted d-flex align-items-center justify-content-center gap-1">
                        <i class="bi bi-hospital text-primary"></i>
                        <span>Govt Medical College Thrissur</span>
                    </small>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const CORRECT_PASSWORD = 'medical123';
        
        // Check if already authenticated
        if (sessionStorage.getItem('authenticated') === 'true') {
            window.location.href = 'index.html';
        }
        
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'bi bi-eye-slash text-primary';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'bi bi-eye text-muted';
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const loginCard = document.querySelector('.login-card');
            
            if (password === CORRECT_PASSWORD) {
                sessionStorage.setItem('authenticated', 'true');
                loginCard.style.transform = 'scale(0.98)';
                loginCard.style.opacity = '0.7';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 300);
            } else {
                errorAlert.classList.remove('d-none');
                loginCard.classList.add('shake');
                setTimeout(() => {
                    loginCard.classList.remove('shake');
                }, 400);
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });
        
        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorAlert').classList.add('d-none');
        });
        
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                sessionStorage.removeItem('authenticated');
            }
        });
    </script>
</body>
</html>
